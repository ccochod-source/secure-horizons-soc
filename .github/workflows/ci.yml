name: CI

# Vérifications automatiques qui NE dépendent pas de secrets (Supabase, OpenAI, GitGuardian).
# Les parcours « live » restent à vérifier localement ou dans un job dédié avec des secrets GitHub.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# Un push qui remplace un précédent sur la même réf annule le run en cours.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            victim_agent/requirements.txt

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Tests Python
        # conftest force MOCK_LLM et une base SQLite jetable : aucun appel réseau requis.
        run: python -m pytest -q

  frontend:
    name: Frontend · typecheck + build + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer Node 22
        # Node 22 exécute les tests écrits en .test.ts sans transpilation préalable.
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        # Next.js ne doit pas échouer faute de .env : le build ici ne lit pas de secrets.
        run: npm run build

      - name: Tests frontend
        run: node --test tests/*.test.ts
